[project]
name = "avci"
version = "1.3.3"
description = "AVCI — Autonomous Offensive Blackbox Hunter. Cold-URL blackbox pentest agent for authorized targets: full-surface recon, generic MCP browser client, temp-mail registration, any-LLM brain (Claude/GPT/DeepSeek/Kimi/GLM/local via LiteLLM), coverage-ledger discipline, evidence-oracle findings, 45 oracle-backed probe classes, OOB blind channel, attack chains + compliance mapping, rate-limited long-run endurance, Textual TUI, checkpoint/resume. XBOW validation-benchmarks: 104/104."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "litellm>=1.60",
    "mcp>=1.2",
]

[project.optional-dependencies]
browser = ["playwright>=1.50"]
vault = ["cryptography>=42"]
tui = ["textual>=0.60", "rich>=13"]
report = ["jinja2>=3.1"]

[project.scripts]
avci = "avci.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["avci"]
